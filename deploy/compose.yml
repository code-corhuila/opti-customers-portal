# The customers interface as a remote of the container. No published port: opti-front proxies /remotes/customers/.
name: opti-customers-portal

services:
  customers-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/customers-portal:local
    networks:
      - platform
    expose:
      - "80"
    restart: unless-stopped

networks:
  platform:
    external: true
